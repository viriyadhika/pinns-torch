program: PINN-Bayesian.py
method: bayes
metric:
  name: loss        # <- this matches run.log["loss"]
  goal: minimize
parameters:
  lr:
    distribution: log_uniform
    min: 0.0001
    max: 0.01
  beta_scaling:
    distribution: log_uniform
    min: 0.000001
    max: 0.01
  prior_std:
    values: [0.3, 0.5, 1.0, 2.0]
  mc:
    values: [1, 4, 8]
  clip_norm:
    values: [0.5, 1.0, 5.0]